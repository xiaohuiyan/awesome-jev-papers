name: Validate catalogue

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate data, generated pages and local links
        run: python scripts/validate.py
      - name: Check validation failure cases
        run: python -m unittest discover -s tests -v
